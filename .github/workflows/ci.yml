name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install docc
        working-directory: .
        run: |
          curl -fsSL https://raw.githubusercontent.com/uxname/docc/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Documents
        working-directory: .
        run: |
          docc check --max-warnings 0
          node skill/scripts/check-sync.mjs
          node skill/scripts/check-sync.test.mjs
      - run: npm ci
      - run: npm run check
      # The browser is cached by Playwright's version; ubuntu-latest already has its system
      # libraries, so no apt step (that step alone took over ten minutes).
      - id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: prototype/screens
          if-no-files-found: ignore
